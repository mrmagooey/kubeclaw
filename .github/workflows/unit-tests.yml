name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            container/agent-runner/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install sub-package dependencies
        # vitest.config.ts includes tests from container/agent-runner, which
        # resolves its own dependencies (e.g. @mariozechner/pi-agent-core and the
        # MCP servers folded in from the old postgres-mcp/mcp-bundle images);
        # without this install those test files fail to load.
        run: npm ci --prefix container/agent-runner

      - name: Run unit tests
        run: npm test
