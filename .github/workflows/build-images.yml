name: Build Container Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only (push: false): verify the images compile in CI without
      # publishing to a registry. The two primary application images are the
      # orchestrator (root Dockerfile) and the agent/base image (container/).

      - name: Build orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: kubeclaw-orchestrator:ci
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator

      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: ./container
          file: ./container/Dockerfile
          push: false
          tags: kubeclaw-agent:ci
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
