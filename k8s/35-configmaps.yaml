# KubeClaw ConfigMaps
# Contains scripts that are mounted into tool pod containers.
#
# kubeclaw-tool-wrapper  — used by sidecar tool pods (mounts at /kubeclaw/tool-wrapper.sh)
#
# The tool-wrapper.sh script watches /shared for {requestId}.request.json files
# written by the kubeclaw-tool-bridge container, pipes the request's .input JSON
# to the wrapped command's stdin, and writes stdout to {requestId}.response.json.
#
# Apply with:
#   kubectl apply -f k8s/35-configmaps.yaml
# File-bridge tool wrapper. Lets a stock image (sh + jq required) serve
# file-bridge ToolSpecs with zero custom code:
#   command: ["/bin/sh", "/kubeclaw/tool-wrapper.sh", "your-command", "arg1"]
# The wrapper watches /shared for {requestId}.request.json written by the
# kubeclaw-tool-bridge container, pipes the request's .input JSON to the
# wrapped command's stdin, and writes stdout to {requestId}.response.json.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeclaw-tool-wrapper
  namespace: kubeclaw
data:
  tool-wrapper.sh: |
    #!/bin/sh
    # No set -e: a single-request failure must not terminate the polling loop.
    SHARED_DIR="${KUBECLAW_SHARED_DIR:-/shared}"
    # Note: KUBECLAW_POLL_INTERVAL controls only this wrapper's scan rate; the
    # bridge container polls for response files on its own fixed schedule.
    POLL_INTERVAL="${KUBECLAW_POLL_INTERVAL:-1}"

    log() { echo "[tool-wrapper] $*" >&2; }

    if [ "$#" -eq 0 ]; then
      log "Usage: tool-wrapper.sh <command> [args...]"
      exit 1
    fi

    log "Watching $SHARED_DIR (command: $*)"
    while true; do
      for req in "$SHARED_DIR"/*.request.json; do
        [ -f "$req" ] || continue
        id=$(basename "$req" .request.json)
        log "Processing request $id"
        if ! input_json=$(jq -c '.input' < "$req" 2>&1); then
          log "Malformed request $id: $input_json"
          tmpfile=$(mktemp "$SHARED_DIR/$id.response.XXXXXX")
          printf '{"error": %s}' "$(printf 'malformed request: %s' "$input_json" | jq -Rs '.')" > "$tmpfile"
          mv "$tmpfile" "$SHARED_DIR/$id.response.json"
          rm -f "$req"
          continue
        fi
        if out=$(printf '%s' "$input_json" | "$@" 2>&1); then
          tmpfile=$(mktemp "$SHARED_DIR/$id.response.XXXXXX")
          printf '{"result": %s}' "$(printf '%s' "$out" | jq -Rs '.')" > "$tmpfile"
          mv "$tmpfile" "$SHARED_DIR/$id.response.json"
        else
          tmpfile=$(mktemp "$SHARED_DIR/$id.response.XXXXXX")
          printf '{"error": %s}' "$(printf '%s' "$out" | jq -Rs '.')" > "$tmpfile"
          mv "$tmpfile" "$SHARED_DIR/$id.response.json"
        fi
        rm -f "$req"
      done
      sleep "$POLL_INTERVAL"
    done
