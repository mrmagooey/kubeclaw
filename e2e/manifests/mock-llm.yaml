---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeclaw-mock-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeclaw-mock-llm
  template:
    metadata:
      labels:
        app: kubeclaw-mock-llm
    spec:
      containers:
        - name: mock-llm
          image: kubeclaw-mock-llm:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 11434
          readinessProbe:
            httpGet:
              path: /health
              port: 11434
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kubeclaw-mock-llm
spec:
  selector:
    app: kubeclaw-mock-llm
  ports:
    - port: 11434
      targetPort: 11434
