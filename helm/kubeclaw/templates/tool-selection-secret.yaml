{{- /*
  Tool-selection HMAC secret used to key credential-approval tokens.

  The orchestrator mints a token on the find-tools request and verifies it on
  a separate approve request, so the key must be stable across restarts and
  replicas. Resolution order:
    - Use .Values.toolSelection.secret if explicitly set.
    - Otherwise look up an existing Secret so upgrades don't rotate the key
      (which would invalidate any in-flight approvals).
    - Fall back to generating a random secret on first install.
*/}}
{{- $existing := lookup "v1" "Secret" (include "kubeclaw.namespace" .) "kubeclaw-tool-selection" }}
{{- $secret := .Values.toolSelection.secret }}
{{- if and (not $secret) $existing (hasKey ($existing.data | default dict) "secret") }}
  {{- $secret = index $existing.data "secret" | b64dec }}
{{- end }}
{{- if not $secret }}
  {{- $secret = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: kubeclaw-tool-selection
  namespace: {{ include "kubeclaw.namespace" . }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  secret: {{ $secret | quote }}
