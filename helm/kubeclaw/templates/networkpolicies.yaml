{{- if .Values.networkPolicy.enabled }}
---
# Agents may only reach: DNS (UDP 53), Redis (TCP 6379), and HTTPS (TCP 443).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeclaw-agent-policy
  namespace: {{ include "kubeclaw.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app: kubeclaw-agent
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: kubeclaw-redis
      ports:
        - protocol: TCP
          port: 6379
    {{- if eq .Values.credentialInjection.mode "off" }}
    - to: []
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with .Values.networkPolicy.extraEgressPorts }}
    - to: []
      ports:
        {{- range . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
---
# Orchestrator: unrestricted egress (needs to create Jobs, call APIs, reach Redis).
# Ingress restricted to port 8080 (health/metrics).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeclaw-orchestrator-policy
  namespace: {{ include "kubeclaw.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app: kubeclaw-orchestrator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to: []
---
# Channel pods: egress to Redis, DNS, and external channel APIs (HTTP + HTTPS).
# Ingress is denied from all cluster pods — kubelet health probes bypass NetworkPolicy.
# For channels with httpPort, channel-pods.yaml adds a per-channel ingress policy.
# No K8s API access — automountServiceAccountToken is false on these pods.
#
# Story 183: registry.npmjs.org, registry.yarnpkg.com, and the npm mirror host
# (when bootstrap.npmRegistry is set) must be denied from channel pods.
# LIMITATION: standard Kubernetes NetworkPolicy cannot express hostname-based deny rules.
# Enable Cilium (ciliumNetworkPolicy.enabled=true) to enforce FQDN-level deny via
# kubeclaw-channel-egress CiliumNetworkPolicy, which uses allowlist semantics:
# only explicitly listed FQDNs are permitted — registry hosts are intentionally excluded.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeclaw-channel-policy
  namespace: {{ include "kubeclaw.namespace" . }}
spec:
  podSelector:
    matchExpressions:
      - key: kubeclaw/channel
        operator: Exists
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: kubeclaw-redis
      ports:
        - protocol: TCP
          port: 6379
    {{- if eq .Values.credentialInjection.mode "off" }}
    - to: []
      ports:
        - protocol: TCP
          port: 443
    - to: []
      ports:
        - protocol: TCP
          port: 80
    {{- end }}
    {{- with .Values.networkPolicy.extraEgressPorts }}
    - to: []
      ports:
        {{- range . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
---
# Tool pods (execution/browser): DNS + Redis IPC + HTTP/HTTPS for web tasks.
# Broader egress than agents (adds port 80) but no K8s API access, no ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeclaw-tool-pod-policy
  namespace: {{ include "kubeclaw.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app: kubeclaw-tool-pod
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: kubeclaw-redis
      ports:
        - protocol: TCP
          port: 6379
    {{- if eq .Values.credentialInjection.mode "off" }}
    - to: []
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with .Values.networkPolicy.extraEgressPorts }}
    - to: []
      ports:
        {{- range . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
---
# Sidecar tool pods (custom user containers): same egress profile as tool pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeclaw-sidecar-tool-policy
  namespace: {{ include "kubeclaw.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app: kubeclaw-sidecar-tool
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: kubeclaw-redis
      ports:
        - protocol: TCP
          port: 6379
    {{- if eq .Values.credentialInjection.mode "off" }}
    - to: []
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    {{- end }}
---
# Capability pods: egress to Redis + DNS. Ingress from channel pods on capability port.
# No K8s API access — automountServiceAccountToken is false on these pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeclaw-capability-policy
  namespace: {{ include "kubeclaw.namespace" . }}
spec:
  podSelector:
    matchExpressions:
      - key: kubeclaw/capability
        operator: Exists
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: kubeclaw/channel
                operator: Exists
        - podSelector:
            matchLabels:
              app: kubeclaw-orchestrator
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: kubeclaw-redis
      ports:
        - protocol: TCP
          port: 6379
    {{- if eq .Values.credentialInjection.mode "off" }}
    - to: []
      ports:
        - protocol: TCP
          port: 443
    - to: []
      ports:
        - protocol: TCP
          port: 80
    {{- end }}
{{- end }}
