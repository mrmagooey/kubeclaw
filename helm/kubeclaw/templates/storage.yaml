---
# Groups: per-group agent filesystems. Requires ReadWriteMany for concurrent agents.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubeclaw-groups
  namespace: {{ include "kubeclaw.namespace" . }}
spec:
  accessModes:
    - {{ .Values.storage.accessMode }}
  {{- include "kubeclaw.storageClassName" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.storage.sizes.groups }}
---
# Sessions: orchestrator<->agent IPC base (KUBECLAW_IPC_BASE=/data/sessions)
# and per-group registered_groups.db. Named "sessions" for historical reasons.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubeclaw-sessions
  namespace: {{ include "kubeclaw.namespace" . }}
spec:
  accessModes:
    - {{ .Values.storage.accessMode }}
  {{- include "kubeclaw.storageClassName" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.storage.sizes.sessions }}
---
# Project: orchestrator project directory mount.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubeclaw-project
  namespace: {{ include "kubeclaw.namespace" . }}
spec:
  accessModes:
    - {{ .Values.storage.accessMode }}
  {{- include "kubeclaw.storageClassName" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.storage.sizes.project }}
---
# Store: SQLite database and orchestrator state.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubeclaw-store
  namespace: {{ include "kubeclaw.namespace" . }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- include "kubeclaw.storageClassName" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.storage.sizes.store }}
{{- range $name, $cfg := .Values.channels }}
{{- if $cfg.enabled }}
---
# Per-channel storage: groups, store, sessions (ReadWriteOnce — each channel pod owns its own PVCs)
# helm.sh/resource-policy: keep on groups and store prevents Helm from deleting these PVCs
# during `helm upgrade` or `helm uninstall`, preserving conversation history, SQLite DB,
# attachments, and per-group memory (Story 35).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubeclaw-channel-{{ $name }}-groups
  namespace: {{ include "kubeclaw.namespace" $ }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- include "kubeclaw.storageClassName" $ | nindent 2 }}
  resources:
    requests:
      storage: {{ $.Values.storage.sizes.groups }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubeclaw-channel-{{ $name }}-store
  namespace: {{ include "kubeclaw.namespace" $ }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- include "kubeclaw.storageClassName" $ | nindent 2 }}
  resources:
    requests:
      storage: {{ $.Values.storage.sizes.store }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubeclaw-channel-{{ $name }}-sessions
  namespace: {{ include "kubeclaw.namespace" $ }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- include "kubeclaw.storageClassName" $ | nindent 2 }}
  resources:
    requests:
      storage: {{ $.Values.storage.sizes.sessions }}
{{- end }}
{{- end }}
