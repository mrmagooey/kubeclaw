{{- if ne .Values.credentialInjection.mode "off" -}}
# Per-tier ServiceAccounts whose tokens are presented to the credential
# broker for identity verification. The broker uses TokenReview to confirm
# the SA, then maps (sa, destination) to a credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeclaw-tool-job
  namespace: {{ include "kubeclaw.namespace" . }}
{{- range $name, $cfg := .Values.channels }}
{{- if $cfg.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeclaw-channel-{{ $name }}
  namespace: {{ include "kubeclaw.namespace" $ }}
{{- end }}
{{- end }}
{{- /*
  Group-scoped capabilities (scope: "group") are deployed on-demand by the
  orchestrator reconciler with its own credentialing model. Skip their
  static ServiceAccount here.
*/ -}}
{{- range $name, $cfg := .Values.capabilities }}
{{- if ne $cfg.scope "group" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeclaw-capability-{{ $name }}
  namespace: {{ include "kubeclaw.namespace" $ }}
{{- end }}
{{- end }}
{{- end }}
