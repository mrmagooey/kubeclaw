{{- if eq .Values.credentialInjection.mode "istio" -}}
# EnvoyFilter patches the kubeclaw egress gateway to call the credential-broker
# via ext_authz for every proxied request. On a 200 response from the broker,
# the returned "authorization" header is stamped on the upstream request.
# The broker receives the workload's SPIFFE identity via the
# x-forwarded-client-cert header that Istio mTLS populates automatically.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: kubeclaw-credential-authz
  namespace: {{ .Values.namespace }}
spec:
  workloadSelector:
    labels:
      istio: kubeclaw-egressgateway
  configPatches:
    # Insert a Lua filter before ext_authz to copy :authority → x-forwarded-authority.
    # The ext_authz headers_to_add field does not support access-log format strings
    # (%REQ(:AUTHORITY)%), so we use a minimal Lua snippet to do the copy instead.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua.set-forwarded-authority
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                function envoy_on_request(handle)
                  local authority = handle:headers():get(":authority") or handle:headers():get("host") or ""
                  -- strip port suffix if present (e.g. "example.com:80" → "example.com")
                  local host = authority:match("^([^:]+)")
                  if host and host ~= "" then
                    handle:headers():replace("x-forwarded-authority", host)
                  end
                  -- Convert method to POST so the ext_authz HTTP service sends POST to the
                  -- credential broker (which only accepts POST /authz* requests). The original
                  -- method is irrelevant for the auth sub-request; the upstream sees whatever
                  -- method the broker's response allows through.
                  handle:headers():replace(":method", "POST")
                end
    # Insert ext_authz HTTP filter before the router filter on the outbound listener.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ext_authz
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
            http_service:
              server_uri:
                uri: http://kubeclaw-credential-broker.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.credentialInjection.broker.port }}
                cluster: outbound|{{ .Values.credentialInjection.broker.port }}||kubeclaw-credential-broker.{{ .Values.namespace }}.svc.cluster.local
                timeout: 5s
              path_prefix: /authz
              authorization_request:
                allowed_headers:
                  patterns:
                    - exact: authorization
                    - exact: x-forwarded-client-cert
                    - exact: x-forwarded-authority
              authorization_response:
                allowed_upstream_headers:
                  patterns:
                    - exact: authorization
                    - exact: x-kubeclaw-substitutions
                    - exact: x-kubeclaw-policy
            failure_mode_allow: false
    # Insert Lua substitution filter immediately after ext_authz so it sees
    # the broker's x-kubeclaw-substitutions / x-kubeclaw-policy response headers,
    # performs placeholder substitution in request headers and body, then strips
    # both headers before the request continues to the upstream.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_authz
      patch:
        operation: INSERT_AFTER
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
{{ .Files.Get "files/envoy-substitution-filter.lua" | indent 16 }}
{{- end }}
