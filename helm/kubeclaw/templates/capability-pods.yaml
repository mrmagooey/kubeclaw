{{- /*
  Group-scoped capabilities (scope: "group") are deployed on-demand by the
  orchestrator reconciler — one per (group × capability) pair — not by this
  static Helm template. Skip them here.
*/ -}}
{{- range $name, $cfg := .Values.capabilities }}
{{- if ne $cfg.scope "group" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeclaw-capability-{{ $name }}
  namespace: {{ include "kubeclaw.namespace" $ }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeclaw-capability-{{ $name }}
  template:
    metadata:
      labels:
        app: kubeclaw-capability-{{ $name }}
        kubeclaw/capability: {{ $name }}
    spec:
      # No K8s API access — capability pods are low priv tier
      automountServiceAccountToken: false
      {{- if ne $.Values.credentialInjection.mode "off" }}
      serviceAccountName: kubeclaw-capability-{{ $name }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: capability
          image: {{ $cfg.image }}
          imagePullPolicy: {{ include "kubeclaw.pullPolicy" $ }}
          env:
            - name: REDIS_URL
              value: redis://kubeclaw-redis:6379
            - name: REDIS_USERNAME
              value: channel
            - name: REDIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubeclaw-redis
                  key: channel-password
            - name: KUBECLAW_CAPABILITY
              value: {{ $name }}
            {{- range $k, $v := $cfg.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{/*
            Capability pods do not inject kubeclaw-secrets API keys via this template;
            any credential env vars come from $cfg.env (operator-supplied).
            credentialSidecarEnv sets HTTPS_PROXY regardless of auditOnly so the
            sidecar observes traffic even in audit-only mode.
            */}}
            {{- if eq $.Values.credentialInjection.mode "sidecar" }}
            {{- include "kubeclaw.credentialSidecarEnv" $ | nindent 12 }}
            {{- end }}
            {{- if eq $.Values.credentialInjection.mode "istio" }}
            # Istio captures all egress via iptables redirection; no
            # HTTPS_PROXY is needed. The base URL overrides below route
            # workload SDKs through the egress gateway, which stamps the
            # broker-supplied Authorization header.
            {{- include "kubeclaw.istioBaseUrlEnv" $ | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $cfg.port | default 8080 }}
              protocol: TCP
            - name: metrics
              containerPort: {{ $.Values.metrics.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            {{- if $cfg.resources }}
            {{- toYaml $cfg.resources | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.capabilityPod.resources | nindent 12 }}
            {{- end }}
        {{- if eq $.Values.credentialInjection.mode "sidecar" }}
        {{- include "kubeclaw.credentialSidecarContainer" $ | nindent 8 }}
        {{- end }}
      {{- if eq $.Values.credentialInjection.mode "sidecar" }}
      volumes:
        {{- include "kubeclaw.credentialSidecarVolumes" $ | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: kubeclaw-capability-{{ $name }}
  namespace: {{ include "kubeclaw.namespace" $ }}
spec:
  selector:
    app: kubeclaw-capability-{{ $name }}
  ports:
    - name: http
      port: {{ $cfg.port | default 8080 }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ $.Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  type: ClusterIP
{{- end }}
{{- end }}
