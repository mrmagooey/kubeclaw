{{- if ne .Values.credentialInjection.mode "off" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeclaw-credential-broker-config
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
    mappings:
      - id: anthropic
        destinations: ["api.anthropic.com"]
        identities: ["*"]
        credentialRef: { kind: Secret, name: kubeclaw-secrets, key: anthropic-api-key }
        headerScheme: bearer
      - id: openai
        destinations: ["api.openai.com"]
        identities: ["*"]
        credentialRef: { kind: Secret, name: kubeclaw-secrets, key: openai-api-key }
        headerScheme: bearer
      - id: openrouter
        destinations: ["openrouter.ai"]
        identities: ["*"]
        credentialRef: { kind: Secret, name: kubeclaw-secrets, key: openrouter-api-key }
        headerScheme: bearer
      - id: voyage
        destinations: ["api.voyageai.com"]
        identities: ["*"]
        credentialRef: { kind: Secret, name: kubeclaw-secrets, key: voyage-api-key }
        headerScheme: bearer
      {{- if and (eq .Values.credentialInjection.mode "istio") .Values.credentialInjection.istio.testFixture.enabled }}
      - id: test-mock
        destinations: ["mock-upstream.kubeclaw-test"]
        identities: ["sa/kubeclaw-tool-job"]
        credentialRef: { kind: Secret, name: kubeclaw-secrets, key: test-mock-token }
        headerScheme: bearer
      {{- end }}
    catalog:
{{- range .Values.credentialInjection.catalog }}
      - id: {{ .id | quote }}
        host: {{ .host | quote }}
        upstreamPort: {{ .upstreamPort | default 443 }}
        credentialFields:
{{- range .credentialFields }}
          - { name: {{ .name | quote }}, envVar: {{ .envVar | quote }} }
{{- end }}
        baseUrlEnvs:
{{- range $k, $v := .baseUrlEnvs }}
          {{ $k }}: {{ $v | quote }}
{{- end }}
        allowOperatorFallback: {{ .allowOperatorFallback | default false }}
        allowedPositions: {{ .allowedPositions | default (list "header" "body") | toJson }}
{{- if .apiKeyShape }}
        apiKeyShape:
          prefix: {{ .apiKeyShape.prefix | quote }}
          minLength: {{ .apiKeyShape.minLength }}
{{- end }}
{{- end }}
{{- end }}
