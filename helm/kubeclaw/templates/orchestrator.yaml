---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeclaw-orchestrator
  namespace: {{ include "kubeclaw.namespace" . }}
---
# Grants the orchestrator permission to create/list/delete tool Jobs and read pod logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeclaw-job-manager
  namespace: {{ include "kubeclaw.namespace" . }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Bootstrap commit (Story 176): exec into the inspector sidecar to read
  # package.json / package-lock.json directly from the runtime PVC (TOCTOU
  # defense). The @kubernetes/client-node Exec uses a WebSocket upgrade (HTTP
  # GET), which the apiserver maps to the RBAC verb "get"; SPDY clients use POST
  # (verb "create"). Grant both so either transport works.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  # Admin shell: create/patch per-channel secrets and trigger rolling restarts
  # Credential injection: create/update/delete per-group Secrets for user-supplied credentials
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete", "get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Per-group capability scale-down: PUT on deployments/scale (distinct from
  # `update` on deployments). Without this, the idle-sweeper's
  # replaceNamespacedDeploymentScale call 403s and the sweep silently no-ops.
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  # MCP server lifecycle: create/update/delete services
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Admin shell: create per-channel PVCs; RAG capability removal deletes them
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Admin shell: manage per-channel Ingress objects (namespace-scoped)
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "patch", "replace", "delete"]
  # ConfigMap access for: CatalogInformer (reads cred broker config),
  # SpecialistReconciler (writes kubeclaw-specialists).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeclaw-orchestrator-binding
  namespace: {{ include "kubeclaw.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: kubeclaw-orchestrator
    namespace: {{ include "kubeclaw.namespace" . }}
roleRef:
  kind: Role
  name: kubeclaw-job-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeclaw-orchestrator
  namespace: {{ include "kubeclaw.namespace" . }}
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels:
      app: kubeclaw-orchestrator
  template:
    metadata:
      labels:
        app: kubeclaw-orchestrator
        kubeclaw.io/role: orchestrator
      {{- if eq .Values.credentialInjection.mode "istio" }}
      annotations:
        # The orchestrator is the trusted control-plane tier; it must not receive
        # an Istio sidecar even though the namespace label enables injection for
        # all other pods. The orchestrator accesses the K8s API directly using
        # its own SA credentials and does not need mesh identity.
        sidecar.istio.io/inject: "false"
      {{- end }}
    spec:
      serviceAccountName: kubeclaw-orchestrator
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command:
            - sh
            - -c
            - chown -R 1000:1000 /app/groups /app/store /data/sessions
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: groups
              mountPath: /app/groups
            - name: store
              mountPath: /app/store
            - name: sessions
              mountPath: /data/sessions
      containers:
        - name: orchestrator
          image: {{ include "kubeclaw.image" (dict "root" . "name" "kubeclaw-orchestrator") }}
          imagePullPolicy: {{ include "kubeclaw.pullPolicy" . }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: REDIS_URL
              value: redis://kubeclaw-redis:6379
            - name: REDIS_USERNAME
              value: orchestrator
            - name: REDIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubeclaw-redis
                  key: admin-password
            - name: REDIS_AGENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubeclaw-redis
                  key: agent-password
            - name: REDIS_TOOL_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubeclaw-redis
                  key: tool-server-password
            - name: ACL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: kubeclaw-redis
                  key: acl-encryption-key
            - name: KUBECLAW_MODE
              value: orchestrator
            - name: KUBECLAW_RUNTIME
              value: kubernetes
            - name: KUBECLAW_NAMESPACE
              value: {{ include "kubeclaw.namespace" . }}
            - name: KUBECLAW_IPC_BASE
              value: /data/sessions
            - name: MAX_CONCURRENT_JOBS
              value: {{ .Values.orchestrator.maxConcurrentJobs | quote }}
            {{- if .Values.orchestrator.toolImageAllowlist }}
            - name: TOOL_IMAGE_ALLOWLIST
              value: {{ .Values.orchestrator.toolImageAllowlist | quote }}
            {{- end }}
            {{- if .Values.orchestrator.toolGroupMountAllowlist }}
            - name: TOOL_GROUP_MOUNT_ALLOWLIST
              value: {{ .Values.orchestrator.toolGroupMountAllowlist | quote }}
            {{- end }}
            {{- if .Values.mcpServers }}
            - name: MCP_SERVERS_VALUES
              value: {{ .Values.mcpServers | toJson | quote }}
            {{- end }}
            {{- if .Values.perGroupCapabilities }}
            - name: PER_GROUP_CAPABILITIES_VALUES
              value: {{ .Values.perGroupCapabilities | toJson | quote }}
            {{- end }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeclaw.secretName" . }}
                  key: anthropic-api-key
                  optional: true
            # The orchestrator does NOT call LLM providers directly — per the
            # four-tier architecture, channels own LLM conversations. These
            # envs are reserved for future use and are intentionally not
            # rewritten by kubeclaw.istioBaseUrlEnv in mode=istio. If the
            # orchestrator ever starts making provider calls, gate these
            # behind mode=sidecar / mode=off and inject istioBaseUrlEnv here.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeclaw.secretName" . }}
                  key: openai-api-key
                  optional: true
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeclaw.secretName" . }}
                  key: openai-base-url
                  optional: true
            - name: DIRECT_LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeclaw.secretName" . }}
                  key: direct-llm-model
                  optional: true
            {{- if .Values.orchestrator.admin.enabled }}
            - name: ADMIN_HTTP_PORT
              value: {{ .Values.orchestrator.admin.port | quote }}
            - name: ADMIN_HTTP_USERNAME
              value: {{ .Values.orchestrator.admin.username | quote }}
            - name: ADMIN_HTTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeclaw.secretName" . }}
                  key: admin-http-password
            {{- end }}
            # Story 182: bootstrap runtime PVC accessModes + steady-state replica count
            - name: BOOTSTRAP_RUNTIME_PVC_ACCESS_MODES
              value: {{ .Values.bootstrap.runtimePvc.accessModes | default (list "ReadWriteOnce") | join "," | quote }}
            - name: BOOTSTRAP_STEADY_STATE_REPLICAS
              value: {{ .Values.bootstrap.steadyState.defaultReplicas | default 1 | quote }}
            {{- if .Values.bootstrap.npmRegistry }}
            # Story 183: air-gapped npm mirror — orchestrator threads this into bootstrap Job env.
            - name: BOOTSTRAP_NPM_REGISTRY
              value: {{ .Values.bootstrap.npmRegistry | quote }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            {{- if .Values.orchestrator.admin.enabled }}
            - name: admin
              containerPort: {{ .Values.orchestrator.admin.port }}
              protocol: TCP
            {{- end }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /liveness
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          volumeMounts:
            - name: groups
              mountPath: /app/groups
            - name: store
              mountPath: /app/store
            - name: sessions
              mountPath: /data/sessions
            - name: specialists-baseline
              mountPath: /etc/kubeclaw/specialists-baseline
              readOnly: true
            - name: tools-baseline
              mountPath: /etc/kubeclaw/tools-baseline
              readOnly: true
            - name: channel-manifests-baseline
              mountPath: /etc/kubeclaw/channel-manifests-baseline
              readOnly: true
            - name: bootstrap-skills-baseline
              mountPath: /etc/kubeclaw/bootstrap-skills-baseline
              readOnly: true
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
      volumes:
        - name: groups
          persistentVolumeClaim:
            claimName: kubeclaw-groups
        - name: store
          persistentVolumeClaim:
            claimName: kubeclaw-store
        - name: sessions
          persistentVolumeClaim:
            claimName: kubeclaw-sessions
        - name: specialists-baseline
          configMap:
            name: kubeclaw-specialists-baseline
            optional: true
        - name: tools-baseline
          configMap:
            name: kubeclaw-tools-baseline
            optional: true
        - name: channel-manifests-baseline
          configMap:
            name: kubeclaw-channel-manifests-baseline
            optional: true
        - name: bootstrap-skills-baseline
          configMap:
            name: kubeclaw-bootstrap-skills-baseline
            optional: true
{{- if .Values.orchestrator.admin.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: kubeclaw-admin
  namespace: {{ include "kubeclaw.namespace" . }}
spec:
  selector:
    app: kubeclaw-orchestrator
  ports:
    - name: admin
      port: {{ .Values.orchestrator.admin.port }}
      targetPort: admin
      protocol: TCP
  type: ClusterIP
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: kubeclaw-orchestrator
  namespace: {{ include "kubeclaw.namespace" . }}
spec:
  selector:
    app: kubeclaw-orchestrator
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  type: ClusterIP
