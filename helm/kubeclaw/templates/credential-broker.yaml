{{- if and .Values.credentialInjection.auditOnly (eq .Values.credentialInjection.mode "off") -}}
{{- fail "credentialInjection.auditOnly=true requires mode != \"off\". The broker is not deployed in mode=off and cannot perform audit-only logging. Set mode: sidecar or mode: istio." -}}
{{- end -}}
{{- if ne .Values.credentialInjection.mode "off" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeclaw-credential-broker
  namespace: {{ .Values.namespace }}
---
# Credential broker RBAC: read Secrets and Pods, create TokenReviews.
#
# Trust widening: per-group credentials are dynamically named (kubeclaw-group-secrets-<group>),
# so the broker cannot enumerate them via resourceNames. The broker reads:
#   - kubeclaw-secrets (operator-provisioned built-in credentials)
#   - kubeclaw-group-secrets-<group> (user-supplied per-group credentials)
#   - kubeclaw-redis (shared Redis client password)
#   - per-channel HTTP secrets (for legacy built-in channels)
#   - admin-shell password (if admin shell is enabled)
#
# Accepted risk: the broker SA can technically read any Secret in the kubeclaw namespace.
# Mitigation: the broker code is hardened to read only what its in-memory catalog and
# per-group filtering permits. No code path reads Secrets outside this allowlist.
# Future hardening: sub-namespace for per-group Secrets.
#
# Pods read: needed for owner-group annotation lookup in both sidecar mode (TokenReview)
# and istio mode (IP-address → pod lookup for SPIFFE identity verification).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeclaw-credential-broker
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeclaw-credential-broker
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeclaw-credential-broker
subjects:
  - kind: ServiceAccount
    name: kubeclaw-credential-broker
    namespace: {{ .Values.namespace }}
---
# TokenReview is cluster-scoped — minimum required cluster permission.
# Name is release-scoped so multiple Helm releases in different namespaces
# can coexist without colliding on this cluster-scoped resource.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-credential-broker-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: kubeclaw-credential-broker
    namespace: {{ .Values.namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: credential-broker
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: kubeclaw-credential-broker }
  ports:
    - name: http
      port: {{ .Values.credentialInjection.broker.port }}
      targetPort: {{ .Values.credentialInjection.broker.port }}
    - name: metrics
      port: {{ .Values.credentialInjection.metrics.port }}
      targetPort: {{ .Values.credentialInjection.metrics.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeclaw-credential-broker
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.credentialInjection.broker.replicas }}
  selector: { matchLabels: { app: kubeclaw-credential-broker } }
  template:
    metadata:
      labels: { app: kubeclaw-credential-broker }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/credential-broker-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: kubeclaw-credential-broker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: {{ .Values.credentialInjection.broker.image }}
          imagePullPolicy: {{ include "kubeclaw.pullPolicy" . }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - { name: KUBECLAW_MODE, value: credential-broker }
            - { name: BROKER_NAMESPACE, value: {{ .Values.namespace | quote }} }
            - { name: BROKER_AUDIENCE, value: kubeclaw-credential-broker }
            - { name: BROKER_PORT, value: {{ .Values.credentialInjection.broker.port | quote }} }
            - { name: BROKER_CONFIG_PATH, value: /etc/credential-broker/config.yaml }
            - name: BROKER_AUDIT_ONLY
              value: {{ .Values.credentialInjection.auditOnly | quote }}
            - name: BROKER_METRICS_PORT
              value: {{ .Values.credentialInjection.metrics.port | quote }}
          ports:
            - { containerPort: {{ .Values.credentialInjection.broker.port }}, name: http }
            - { containerPort: {{ .Values.credentialInjection.metrics.port }}, name: metrics }
          volumeMounts:
            - { name: config, mountPath: /etc/credential-broker }
          resources: {{ toYaml .Values.credentialInjection.broker.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: config
          configMap: { name: kubeclaw-credential-broker-config }
{{- end }}
