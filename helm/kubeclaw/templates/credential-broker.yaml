{{- if ne .Values.credentialInjection.mode "off" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeclaw-credential-broker
  namespace: {{ .Values.namespace }}
---
# Read kubeclaw-secrets and create TokenReviews. Scoped to the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeclaw-credential-broker
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["kubeclaw-secrets"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeclaw-credential-broker
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeclaw-credential-broker
subjects:
  - kind: ServiceAccount
    name: kubeclaw-credential-broker
    namespace: {{ .Values.namespace }}
---
# TokenReview is cluster-scoped — minimum required cluster permission.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeclaw-credential-broker-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: kubeclaw-credential-broker
    namespace: {{ .Values.namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: credential-broker
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: kubeclaw-credential-broker }
  ports:
    - name: http
      port: {{ .Values.credentialInjection.broker.port }}
      targetPort: {{ .Values.credentialInjection.broker.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeclaw-credential-broker
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.credentialInjection.broker.replicas }}
  selector: { matchLabels: { app: kubeclaw-credential-broker } }
  template:
    metadata:
      labels: { app: kubeclaw-credential-broker }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/credential-broker-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: kubeclaw-credential-broker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: {{ .Values.credentialInjection.broker.image }}
          imagePullPolicy: {{ include "kubeclaw.pullPolicy" . }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - { name: KUBECLAW_MODE, value: credential-broker }
            - { name: BROKER_NAMESPACE, value: {{ .Values.namespace | quote }} }
            - { name: BROKER_AUDIENCE, value: kubeclaw-credential-broker }
            - { name: BROKER_PORT, value: {{ .Values.credentialInjection.broker.port | quote }} }
            - { name: BROKER_CONFIG_PATH, value: /etc/credential-broker/config.yaml }
          ports: [{ containerPort: {{ .Values.credentialInjection.broker.port }}, name: http }]
          volumeMounts:
            - { name: config, mountPath: /etc/credential-broker }
          resources: {{ toYaml .Values.credentialInjection.broker.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: config
          configMap: { name: kubeclaw-credential-broker-config }
{{- end }}
