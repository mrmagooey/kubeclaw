# Default values for kubeclaw.

# Kubernetes namespace to install into.
# Leave empty (or unset) to use the --namespace flag passed to helm install/upgrade.
# Setting this overrides .Release.Namespace and is preserved for backward compatibility
# with existing installations that pin the namespace explicitly.
namespace: ""

image:
  # Container registry prefix. Empty = use local images (imagePullPolicy: Never).
  # Example: "registry.example.com/myorg"
  registry: ""
  # Tag applied to all kubeclaw images.
  tag: latest
  # Override pull policy. Defaults to Never (local images) when registry is
  # empty, and Always when a registry is set.
  pullPolicy: ""

orchestrator:
  replicas: 1
  # Maximum number of tool Jobs that can run concurrently.
  maxConcurrentJobs: 10
  # Admin HTTP interface — LLM-powered admin shell served as a sidecar.
  # Enabled by default on port 9090 with auto-generated credentials.
  admin:
    enabled: true
    port: 9090
    # Basic Auth username. Password is stored in secrets.adminHttpPassword.
    username: admin
  # Comma-separated glob patterns for permitted sidecar tool pod images.
  # Supports '*' wildcards, e.g. "kubeclaw-*:*,registry.example.com/*".
  # Empty (default) permits any image — set this in production to lock down tool containers.
  toolImageAllowlist: ""
  # Images permitted to mount the group PVC into their tool container.
  # Default-deny: empty allows nothing. alpine:* enables the bash_persist tool.
  toolGroupMountAllowlist: "alpine:*"
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

redis:
  # Redis admin password. Auto-generated on first install if left empty.
  # Once set, the generated value is preserved across upgrades via Secret lookup.
  password: ""
  # Persistent volume size for Redis data.
  storage: 10Gi
  # Redis maxmemory limit in Redis-compatible units (mb/gb). Must match resources.limits.memory.
  maxmemory: 2gb
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 2Gi
      cpu: "1"

storage:
  # ReadWriteOnce: suitable for single-node / minikube (no concurrent agents).
  # ReadWriteMany: required for production with concurrent tool jobs.
  #   Needs a CSI driver that supports RWX (e.g. EFS, Azure Files, NFS, Ceph).
  accessMode: ReadWriteOnce
  # Storage class name. Empty = use the cluster default.
  storageClass: ""
  sizes:
    groups: 50Gi
    sessions: 20Gi
    project: 10Gi
    store: 1Gi

# Application credentials.
secrets:
  # Your Anthropic API key (https://console.anthropic.com/) — for channel pods and tool Jobs
  anthropicApiKey: ""
  # Optional: Anthropic model id (e.g. claude-opus-4-5). Defaults to claude-sonnet-4-5.
  anthropicModel: ""
  # OpenAI-compatible API key — for DirectLLMRunner and AdminShell.
  # Works with OpenAI, OpenRouter, Groq, Mistral, Ollama, and any compatible endpoint.
  openaiApiKey: ""
  # Optional: override the API base URL (e.g. https://openrouter.ai/api/v1)
  openaiBaseUrl: ""
  # Optional: separate base URL for OpenAI-compatible embeddings. Use this
  # when the chat LLM (openaiBaseUrl) does not implement /v1/embeddings
  # (e.g. a self-hosted llama.cpp server started without --embeddings).
  # Defaults to openaiBaseUrl when empty.
  embeddingBaseUrl: ""
  # Optional: override the default embedding vector dimensionality. Only set
  # when the embedding endpoint returns vectors of a non-default size (e.g.
  # a self-hosted small embedding model with 384 dims). Defaults: 1536 for
  # openai provider, 1024 for voyage.
  embeddingDim: ""
  # Optional: override the embedding model name. Defaults to provider's
  # default (text-embedding-3-small for openai, voyage-3 for voyage).
  embeddingModel: ""
  # Optional: default model for DirectLLMRunner / AdminShell (e.g. gpt-4o, openai/gpt-4o)
  directLlmModel: ""
  # Optional: OpenRouter API key (https://openrouter.ai/) — for agent jobs using openrouter provider.
  openrouterApiKey: ""
  # Optional: Voyage AI API key (https://www.voyageai.com/) — for Voyage embeddings.
  voyageApiKey: ""
  # Optional: Brave Search API key (https://brave.com/search/api/) — operator fallback for the
  # brave-search catalog entry; feeds kubeclaw-secrets[brave-search] used by the credential broker
  # when resolving web_search egress in sidecar/istio mode.
  braveApiKey: ""
  # Admin HTTP interface password. Auto-generated on first install if left empty.
  adminHttpPassword: ""
  # Set to use an existing Secret instead of creating one from the values above.
  # The Secret must contain keys: anthropic-api-key,
  # openai-api-key (optional), openai-base-url (optional), voyage-api-key (optional)
  existingSecret: ""

agent:
  # How long (seconds) a tool Job may run before being killed.
  timeoutSeconds: 3600
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 4Gi
      cpu: "2"

networkPolicy:
  # Disable to troubleshoot connectivity issues; re-enable in production.
  enabled: true
  # Extra TCP ports allowed for egress from channel, agent, and tool pods.
  # Use this for self-hosted LLM endpoints on non-standard ports
  # (e.g. 8080 for llama.cpp, 11434 for Ollama).
  #
  # Note: declarative channel install (channels.<N>.enabled=true) stages the
  # runtime adapter via a `stage-runtime` init container that runs `npm ci`,
  # which needs egress to the npm registry on port 443.  This egress is
  # permitted when credentialInjection.mode=off.  For sidecar/istio mode, add
  # 443 here (or pre-bake adapter deps into the image) so `npm ci` can reach
  # the registry:
  #   networkPolicy:
  #     extraEgressPorts:
  #       - 443
  extraEgressPorts: []
  # Example:
  #   extraEgressPorts:
  #     - 8080
  #     - 11434

# Channel pods — one Deployment per channel instance.
# Each channel pod runs the same orchestrator image with KUBECLAW_MODE=channel.
# Channel pods have no Kubernetes RBAC (automountServiceAccountToken: false).
# Tool pod spawning is delegated to the orchestrator via Redis.
#
# The key is the channel instance name (used for K8s resource naming).
# The optional "type" field selects the channel factory (defaults to the key name).
# This allows multiple instances of the same type (e.g. two HTTP channels).
#
# Example:
#   channels:
#     telegram:              # type defaults to "telegram"
#       enabled: true
#       envVars:
#         - name: TELEGRAM_BOT_TOKEN
#           key: bot-token   # key in Secret kubeclaw-channel-telegram
#
#     http:
#       enabled: true
#       httpPort: 4080
#       envVars:
#         - name: HTTP_CHANNEL_USERS
#           key: users
#         - name: HTTP_CHANNEL_PORT
#           key: port
#           optional: true
#
#     http-staging:          # second HTTP channel instance
#       type: http           # uses the "http" factory
#       enabled: true
#       httpPort: 4081
#       envVars:
#         - name: HTTP_CHANNEL_USERS
#           key: users       # from Secret kubeclaw-channel-http-staging
#         - name: HTTP_CHANNEL_PORT
#           key: port
#           optional: true
channels: {}

# HTTP channel global settings (applied to all HTTP channel instances).
httpChannel:
  rateLimit:
    # Maximum POST /message requests per user per 60-second sliding window.
    # 0 = unlimited. Default 60 allows one message per second on average.
    perUserMessagesPerMinute: 60
  attachments:
    # Maximum number of uploaded files stored per user.
    # 0 (default) = unlimited.
    maxCountPerUser: 0
    # Maximum cumulative bytes of stored files per user.
    # 0 (default) = unlimited.
    maxSizeBytesPerUser: 0
  cors:
    # Value for the Access-Control-Allow-Origin response header.
    # Use "*" to allow any origin (default), or set to a specific origin such
    # as "https://app.example.com" to restrict cross-origin access.
    origin: "*"
  # Number of days to retain resolved tool_jobs rows in the channel SQLite DB.
  # Resolved rows older than this are deleted once per hour.
  # Set to 0 to disable pruning entirely.
  toolJobsRetentionDays: 30
  # Override the prune interval in milliseconds (default: 3600000 = 1 hour).
  # Set to a lower value in e2e test deployments so the prune tick fires quickly.
  toolJobsPruneIntervalMs: "3600000"
  # Enable /debug/* endpoints. MUST be false in production.
  # Set to true only in e2e test deployments.
  debugEndpointsEnabled: false

# Default resource limits for channel pods.
channelPod:
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

# Per-group capability type declarations.
# Each entry declares a capability type that can be provisioned per-group via
# the `/capabilities add <type>` slash command. The `type` field selects a
# registered builder (e.g. "echo"). Unknown types cause a fatal error at boot.
#
# NOTE: `echo` is a test-only builder. Do not declare it in production.
#
# Example:
#   perGroupCapabilities:
#     - type: echo
#       image: kubeclaw-echo:e2e-test
#       scaleDownAfterIdleSeconds: 120
perGroupCapabilities: []

# Capability pods — long-lived feature pods (low priv tier).
# Each capability runs a user-supplied container image as a Deployment + Service.
# Capabilities have no Kubernetes API access (automountServiceAccountToken: false).
# They connect to Redis for IPC-based discovery registration.
#
# The key is the capability name (used for K8s resource naming).
#
# Example:
#   capabilities:
#     mcp-server:
#       image: my-mcp-server:latest
#       port: 8080
#       env: {}
#       resources:
#         requests:
#           memory: "256Mi"
#           cpu: "100m"
#         limits:
#           memory: "512Mi"
#           cpu: "500m"
capabilities:
  filesystem:
    kind: mcp
    scope: group
    image: kubeclaw-mcp-bundle:latest
    command: ["node", "/app/index.js", "--server", "filesystem", "--root", "/data"]
    port: 3000
    path: /mcp
    volumeFromGroupPvc: true
    credentialsFrom: none
    scaleDownAfterIdleSeconds: 600
    allowedTools:
      - read_file
      - write_file
      - list_directory
      - search_files
      - create_directory
    env:
      KUBECLAW_FS_MAX_FILE_BYTES: "104857600"
      NODE_OPTIONS: "--max-old-space-size=384"
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 512Mi
        cpu: 500m

  database:
    kind: mcp
    scope: group
    pinned: true
    image: kubeclaw-postgres-mcp:latest
    port: 3000
    path: /mcp
    credentialsFrom: secret
    allowedTools: [query]          # execute is offered by the server but hidden until opted in per group
    podSecurity:
      fsGroup: 999                 # postgres image's data group (postgres:16 runs as uid/gid 999)
    storage:
      sizeGi: 5
      mountPath: /var/lib/postgresql/data
      container: postgres
    env:
      PGHOST: "127.0.0.1"
      PGUSER: kubeclaw             # rw role (= POSTGRES_USER); password from the per-group secret
      PG_RO_USER: kubeclaw_ro      # ro role created by the server on boot; password from the secret
      PGDATABASE: kubeclaw
      KUBECLAW_DB_STATEMENT_TIMEOUT_MS: "5000"
      KUBECLAW_DB_MAX_ROWS: "1000"
    sidecars:
      - name: postgres
        image: postgres:16
        port: 5432
        env:
          POSTGRES_USER: kubeclaw
          POSTGRES_DB: kubeclaw
          PGDATA: /var/lib/postgresql/data/pgdata
          # POSTGRES_PASSWORD comes from the per-group creds secret (envFrom)
    resources:
      requests: { memory: 256Mi, cpu: 100m }
      limits: { memory: 1Gi, cpu: "1" }

# Default resource limits for capability pods.
capabilityPod:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

# MCP (Model Context Protocol) servers — deployed as separate pods.
# Each server runs a container image that exposes MCP tools over HTTP.
# Channel pods connect and discover tools automatically.
#
# Example:
#   mcpServers:
#     weather:
#       image: mcp/weather-server:latest
#       port: 3000             # container port (default 3000)
#       path: /mcp             # MCP endpoint path (default /mcp)
#       channels: [telegram, http]   # restrict access (empty = all channels)
#       env:
#         API_KEY: "your-key"
#       resources:
#         memoryRequest: 128Mi
#         memoryLimit: 256Mi
mcpServers: {}

# CiliumNetworkPolicy — FQDN-based egress control for tool jobs and orchestrator.
# Requires Cilium as the cluster CNI. Disabled by default (uses standard NetworkPolicy).
# Enable in values-minikube.yaml or any Cilium-enabled environment.
ciliumNetworkPolicy:
  enabled: false
  agent:
    # FQDNs tool jobs may contact externally (port 443 only).
    # Use matchName for exact hostnames; see values-minikube.yaml for examples.
    allowedFQDNs: []
  orchestrator:
    # FQDNs the orchestrator may contact externally (ports 443 and 80).
    allowedFQDNs: []
  channel:
    # FQDNs channel pods may contact externally (ports 443 and 80).
    # Add channel-specific APIs here, e.g. api.telegram.org, discord.com, slack.com.
    # If empty, falls back to broad port-based egress in the standard NetworkPolicy.
    allowedFQDNs: []
  toolPod:
    # FQDNs tool pods may contact externally (ports 443 and 80).
    # Tool pods handle web_fetch, browser, and bash with curl — they need internet access.
    # If empty, all HTTP/HTTPS egress is allowed (standard NetworkPolicy behaviour).
    allowedFQDNs: []

# --- Credential injection (network-layer auth header injection) ---
# When enabled, third-party API credentials are NOT injected as env vars
# into channel/capability/tool-job pods. Instead, a credential-broker
# service holds the secrets and a sidecar (or Istio egress gateway)
# stamps the Authorization header on outbound HTTPS requests.
# See docs/CREDENTIAL_INJECTION.md for operator detail.
credentialInjection:
  # mode: off | sidecar | istio
  # - off:     no broker, env-var injection (legacy behavior)
  # - sidecar: per-pod Envoy sidecar, works on any cluster (default for new installs)
  # - istio:   Istio egress gateway (requires Istio CRDs)
  mode: "sidecar"

  # auditOnly: when true, the broker is deployed and sidecar-injected but does NOT
  # strip workload env vars and does NOT stamp the Authorization header.
  # The broker logs and metrics record every decision as a dry-run.
  # Requires mode != off (fail at render time if mode=off).
  auditOnly: false

  broker:
    image: ghcr.io/mrmagooey/kubeclaw-credential-broker:latest
    port: 8080
    replicas: 1
    # How often to poll the config file for changes (ms).
    # Uses stat() to follow symlinks — required for Kubernetes ConfigMap mounts
    # which update via symlink swap (inotify/watchFile miss these).
    configWatchIntervalMs: 5000
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 500m, memory: 256Mi }

  sidecar:
    image: envoyproxy/envoy:v1.31-latest
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits:   { cpu: 200m, memory: 128Mi }
    listenPort: 8443

  internalCA:
    # If false, operator must supply their own kubeclaw-egress-ca-tls Secret.
    autoProvision: true
    # Renewal threshold; cert-manager defaults are fine.
    duration: 87600h    # 10y
    renewBefore: 720h   # 30d

  # istio: settings for mode=istio (Istio egress gateway).
  # Ignored when mode != "istio".
  istio:
    gateway:
      # replicas: number of egress gateway pods. 2 for HA (recommended for production).
      replicas: 2
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits:   { cpu: 500m, memory: 256Mi }

    # ambientMode: ambient + waypoint support. MUST remain false — ambient mode is
    # out of scope for Phase 2. A follow-up plan will cover waypoint-based header
    # injection when Istio 1.26+ stabilises the API.
    ambientMode: false

    # additionalDestinations: hostnames beyond the built-in broker mappings that
    # the egress gateway should allow and create ServiceEntry resources for.
    # Example: ["my-mcp-server.internal:8443"]
    additionalDestinations: []

    # testFixture: e2e-only knob. Renders an in-cluster mock upstream and
    # adds a broker mapping for it. Never enable in production — the broker
    # mapping accepts the kubeclaw-tool-job identity and stamps a literal
    # test token, which is harmless in isolation but pollutes the audit log.
    testFixture:
      enabled: false

  # Operator-curated catalog of destinations users can register their own credentials for.
  # Each entry declares the destination host, what credential fields it needs, and which
  # env vars on tool-job pods will carry the placeholders. The broker substitutes the real
  # credential value at egress.
  catalog:
    - id: brave-search
      host: api.search.brave.com
      upstreamPort: 443
      credentialFields:
        - { name: api_key, envVar: BRAVE_API_KEY }
      allowOperatorFallback: true
      allowedPositions: [header]
      apiKeyShape: { prefix: "BSA", minLength: 30 }
    - id: google-places
      host: places.googleapis.com
      upstreamPort: 443
      credentialFields:
        - { name: api_key, envVar: GOOGLE_PLACES_API_KEY }
      baseUrlEnvs:
        # http:// scheme is intentional — istio egress needs it so the sidecar
        # can intercept. The broker upgrades the upstream connection to HTTPS
        # internally.
        GOOGLE_PLACES_BASE_URL: "http://places.googleapis.com"
      allowOperatorFallback: false
      allowedPositions: [header]
      apiKeyShape: { prefix: "AIza", minLength: 39 }
    - id: openai
      host: api.openai.com
      upstreamPort: 443
      credentialFields:
        - { name: api_key, envVar: OPENAI_API_KEY }
      baseUrlEnvs:
        # http:// scheme is intentional — Envoy originates TLS upstream; cleartext
        # hop is loopback (sidecar) or mesh-mTLS (istio), never the external wire.
        # /v1 suffix required: pi-ai and the OpenAI SDK append paths like
        # /chat/completions to this base URL, so it must end at /v1.
        OPENAI_BASE_URL: "http://api.openai.com/v1"
      allowOperatorFallback: true
      allowedPositions: [header]
      apiKeyShape: { prefix: "sk-", minLength: 20 }
    - id: anthropic
      host: api.anthropic.com
      upstreamPort: 443
      credentialFields:
        - { name: api_key, envVar: ANTHROPIC_API_KEY }
      baseUrlEnvs:
        # Bare host — pi-ai's anthropic-messages api uses the host directly and
        # appends its own paths (e.g. /v1/messages). No trailing path here.
        ANTHROPIC_BASE_URL: "http://api.anthropic.com"
      allowOperatorFallback: true
      allowedPositions: [header]
      apiKeyShape: { prefix: "sk-ant-", minLength: 20 }
    - id: openrouter
      host: openrouter.ai
      upstreamPort: 443
      credentialFields:
        - { name: api_key, envVar: OPENROUTER_API_KEY }
      baseUrlEnvs:
        # /api/v1 suffix required: pi-ai defaults https://openrouter.ai/api/v1
        # and appends paths like /chat/completions to this base URL.
        OPENROUTER_BASE_URL: "http://openrouter.ai/api/v1"
      allowOperatorFallback: true
      allowedPositions: [header]
      apiKeyShape: { prefix: "sk-or-", minLength: 20 }
    - id: voyage
      host: api.voyageai.com
      upstreamPort: 443
      credentialFields:
        - { name: api_key, envVar: VOYAGE_API_KEY }
      baseUrlEnvs:
        # Bare host — embedding-client.ts posts to ${VOYAGE_BASE_URL}/v1/embeddings,
        # so the base URL must be the bare host without any path suffix.
        VOYAGE_BASE_URL: "http://api.voyageai.com"
      allowOperatorFallback: true
      allowedPositions: [header]
  #   - id: replicate
  #     host: api.replicate.com
  #     upstreamPort: 443
  #     credentialFields:
  #       - { name: token, envVar: REPLICATE_API_TOKEN }
  #     baseUrlEnvs:
  #       REPLICATE_API_URL: "http://api.replicate.com"
  #     allowOperatorFallback: false
  #     allowedPositions: [header, body]
  #     apiKeyShape: { prefix: "r8_", minLength: 30 }

  metrics:
    enabled: true
    # Metrics are served on a dedicated port separate from broker.port (8080)
    # so scraping does not compete with authz request traffic.
    port: 9090
    serviceMonitor:
      # Set to true if your cluster runs prometheus-operator.
      enabled: false
      interval: "30s"

# Global specialist catalog. Empty by default — every channel sees no specialists
# until you register some here or via the admin shell. See docs/SPECIALISTS.md.
specialists:
  - name: Researcher
    prompt: |
      You are a web-research specialist. When given a topic or question:
      1. Search for relevant, current information using available search tools.
      2. Fetch and read promising sources to gather details.
      3. Synthesise findings into a concise, structured summary with:
         - A one-paragraph executive summary.
         - Key facts as a bulleted list.
         - Source URLs cited inline.
      Stay factual; note when information is uncertain or conflicting.
    triggers:
      - researcher
    llmProvider: openrouter
    memory:
      isolated: false
    tools:
      - web_search
      - web_fetch
# Example:
# specialists:
#   - name: CodeReview
#     prompt: |
#       You are a code-review specialist. Focus on security, performance, maintainability.
#     llmProvider: claude
#     tools: [mcp:fetch]

# Global tool catalog. Empty by default — register tools via the admin shell
# (register_tool) or add entries here. Each entry is a ToolSpec; an optional
# `channels:` list scopes the tool to specific channels (omit = all channels).
tools:
  - name: bash
    description: Run a shell command in an ephemeral sandbox (no persistent changes; returns the command output).
    parameters:
      type: object
      properties:
        command: { type: string }
      required: [command]
    image: alpine:latest
    pattern: file
    mount: scratch
    run: 'sh -c "$(cat "$INPUT_DIR/command")"'
  - name: bash_persist
    description: Run a shell command against the group's persistent files. Changes are saved to the group filesystem.
    parameters:
      type: object
      properties:
        command: { type: string }
      required: [command]
    image: alpine:latest
    pattern: file
    mount: group
    run: 'sh -c "$(cat "$INPUT_DIR/command")"'
  - name: web_fetch
    description: Fetch the raw content of a URL over HTTP(S).
    parameters:
      type: object
      properties:
        url: { type: string }
      required: [url]
    image: curlimages/curl:latest
    pattern: file
    mount: none
    run: 'curl -sSL -A "Mozilla/5.0 KubeClaw/1.0" -- "$(cat "$INPUT_DIR/url")"'
  - name: web_search
    description: Search the web via the Brave Search API. Returns the raw Brave JSON response (up to 10 results).
    parameters:
      type: object
      properties:
        query: { type: string }
      required: [query]
    image: curlimages/curl:latest
    pattern: file
    mount: none
    credentials: [brave-search]
    run: 'curl -sS -G -H "X-Subscription-Token: $BRAVE_API_KEY" --data-urlencode "q=$(cat "$INPUT_DIR/query")" --data-urlencode "count=10" "https://api.search.brave.com/res/v1/web/search"'
  - name: places_search
    description: >-
      Search for local places (restaurants, cafés, shops, attractions) by free-text
      query via the Google Places API. Put the location in the query text, e.g.
      "ramen in Melbourne CBD". Returns the raw Google Places searchText JSON.
    parameters:
      type: object
      properties:
        query: { type: string }
      required: [query]
    image: curlimages/curl:latest
    pattern: file
    mount: none
    credentials: [google-places]
    run: >-
      q=$(tr -d '\n\r' < "$INPUT_DIR/query" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g');
      curl -sS -X POST
      -H "Content-Type: application/json"
      -H "X-Goog-Api-Key: $GOOGLE_PLACES_API_KEY"
      -H "X-Goog-FieldMask: places.displayName,places.formattedAddress,places.location,places.rating,places.priceLevel,places.types,places.regularOpeningHours.openNow,places.userRatingCount"
      --data "{\"textQuery\":\"$q\"}"
      "$GOOGLE_PLACES_BASE_URL/v1/places:searchText"
  - name: browser
    description: Drive a real web browser (Chromium). Call snapshot to see the page (it returns the interactive elements with refs and the visible text), then click/type using a ref. Actions persist within a session.
    parameters:
      type: object
      properties:
        action: { type: string, enum: [navigate, snapshot, click, type, press, back, wait] }
        url:    { type: string }
        ref:    { type: string }
        text:   { type: string }
        submit: { type: boolean }
        key:    { type: string }
        for:    { type: string }
      required: [action]
    image: chromedp/headless-shell:latest
    pattern: cdp
    port: 9222
    memoryRequest: 256Mi
    memoryLimit: 1Gi
    cpuRequest: 100m
    cpuLimit: "1"
    timeout: 600000

# Prometheus metrics scraping. Requires prometheus-operator in the cluster.
metrics:
  # Port on which each tier exposes /metrics. Must match METRICS_PORT env var.
  port: 9091
  serviceMonitor:
    # Set to true to create ServiceMonitor resources for orchestrator, channels,
    # and capabilities. Requires prometheus-operator CRDs to be installed.
    enabled: false
    interval: "30s"

# --- Alerting and Dashboards ---
# Requires prometheus-operator (kube-prometheus-stack) for PrometheusRule CRD.
alerts:
  # Set to true to deploy the PrometheusRule with all 7 kubeclaw alerts.
  enabled: false
  # Configurable thresholds — see each alert's annotation for context.
  llmLatencyBudgetSeconds: 60
  groupQueueSaturationDepth: 50

dashboards:
  # Set to true to deploy kubeclaw-overview and kubeclaw-llm-detail as ConfigMaps
  # with the grafana_dashboard: "1" label (auto-discovered by the Grafana sidecar).
  enabled: false

# ─── Bootstrap channel configuration (Story 174) ─────────────────────────────
# bootstrap.channelManifests: per-channel-type npm manifests used by bootstrap Jobs.
# Each key is a channel type name; each value is an object with:
#   packageJson:     string — JSON content of package.json for this channel type
#   packageLockJson: string — JSON content of package-lock.json for this channel type
#   manifestHash:    string — sha256(canonical(packageJson)+'\n'+canonical(packageLockJson))
#                            (compute with: node -e "const{createHash}=require('crypto');...")
#
# bootstrap.npmRegistry: optional npm registry URL (default: https://registry.npmjs.org)
# bootstrap.timeoutSeconds: Job activeDeadlineSeconds (default: 900)
# bootstrap.pvcSize: per-channel runtime PVC size (default: 1Gi)
# bootstrap.allowedLifecycleScripts: lifecycle script names the orchestrator permits
#                                    in manifests (default: [] — none allowed)
bootstrap:
  npmRegistry: ""
  npmRegistryAuth:
    # Name of a K8s Secret holding key `auth-token` for the npm mirror.
    # Only used when bootstrap.npmRegistry is set.
    # The credential broker reads this secret and stamps Authorization: Bearer
    # on outbound requests to the mirror host.
    # Example: bootstrap.npmRegistryAuth.secretRef: kubeclaw-npm-mirror-auth
    secretRef: ""
  timeoutSeconds: 900
  pvcSize: 1Gi
  allowedLifecycleScripts: []
  # runtimePvc.accessModes: PVC access modes for the per-channel runtime PVC.
  # Set to [ReadWriteMany] only if your storage class supports RWX (NFS, EFS, CephFS, etc.).
  # On RWX, steady-state channel Deployments may scale to multiple replicas — the runtime
  # PVC mounts read-only across all replicas. On RWO (default), each channel runs as a
  # single pod.
  runtimePvc:
    accessModes:
      - ReadWriteOnce
  # steadyState.defaultReplicas: initial replica count for the steady-state channel Deployment.
  # Ignored when runtimePvc.accessModes contains only ReadWriteOnce — the HPA guardrail
  # caps maxReplicas: 1 regardless. Only takes effect on RWX clusters.
  steadyState:
    defaultReplicas: 1
  # channelManifests: {}
  # Example:
  #   channelManifests:
  #     telegram:
  #       packageJson: |
  #         {"name":"runtime","dependencies":{"telegraf":"4.16.3"}}
  #       packageLockJson: |
  #         {"name":"runtime","lockfileVersion":3,...}
  #       manifestHash: "abc123..."
  channelManifests:
    telegram:
      hostMode: channel-runner
