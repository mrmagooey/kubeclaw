  timeoutSeconds: 900
  pvcSize: 1Gi
  channelManifests:
    telegram:
      packageJson: |
        {"name":"runtime","version":"1.0.0","dependencies":{"telegraf":"4.16.3"}}
      packageLockJson: |
        {"name":"runtime","lockfileVersion":3,"requires":true,"packages":{"":{"name":"runtime","version":"1.0.0","dependencies":{"telegraf":"4.16.3"}}}}
      manifestHash: "d1b52f26cee92aa02e0f46ec25d3d8ca70ee8abf1835e651f65cadf69edf1ada"
    nanoid-echo:
      packageJson: |
        {"name":"nanoid-echo-runtime","version":"1.0.0","dependencies":{"nanoid":"5.0.7"}}
      packageLockJson: |
